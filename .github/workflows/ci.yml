# This is a Github Workflow that runs tests on any push or pull request.
# If the tests pass and this is a push to the master branch it also runs Semantic Release.
name: CI
on: [push, pull_request]

permissions: {}

env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: false

jobs:
  test_push:
    if: github.event_name == 'push'
    name: Test on push
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install deps
        run: yarn install

      - name: Run tests
        timeout-minutes: 5
        run: yarn test:cov

      - name: Save coverage
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1


  test_pr:
    if: github.event_name == 'pull_request'
    name: Test PR (Node v26, OS ubuntu-26.04)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install deps
        run: yarn install

      - name: Run tests
        timeout-minutes: 2
        run: yarn test

  smoke_node:
    if: github.event_name == 'pull_request'
    name: Smoke (Node v${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 16, 18, 20, 22, 24, 26 ]

    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install prod deps only
        run: yarn install --production --ignore-scripts --ignore-engines

      - name: Run smoke tests
        timeout-minutes: 2
        run: yarn test:smoke

  smoke_os:
    if: github.event_name == 'pull_request'
    name: Smoke (OS ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26, windows-2025 ]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install prod deps only
        run: yarn install --production --ignore-scripts

      - name: Run smoke tests
        timeout-minutes: 2
        run: yarn test:smoke

  docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Docs
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build docs
        run: yarn docs

      - name: Save docs
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    # https://github.community/t/trigger-job-on-tag-push-only/18076
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test_push, docs]
    runs-on: ubuntu-26.04
    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Load docs
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: docs

      - name: Release
        env:
          VERBOSE: ${{ secrets.VERBOSE }}
          GH_USER: x-access-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OIDC: true
          NPM_PROVENANCE: true
          GIT_COMMITTER_NAME: ${{ secrets.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
        run: npm_config_yes=true npx zx-semrel

      - name: Load coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage

      - name: Push coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx ggcp lcov.info "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git/coverage/${{ github.sha }}" --cwd=${{ runner.temp }}/coverage --message='chore: push coverage'

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: ${{ runner.temp }}/coverage/lcov.info
